<html>
<head>
    <title>Ocean Landscape</title>
    <style>
        body {
            background-color: #87CEEB; /* Sky color */
        }
        .coral-reef {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            background: url('coral-reef.png') no-repeat center bottom;
            background-size: cover;
        }
        .fish {
            position: absolute;
            bottom: 50px;
            animation: swim 5s infinite;
        }
        @keyframes swim {
            0% { transform: translateX(0); }
            100% { transform: translateX(100vw); }
        }
    </style>
</head>
<body>
    <div class="coral-reef"></div>
    <img class="fish" src="fish.png" alt="fish1" style="left: 20%;">
    <img class="fish" src="fish.png" alt="fish2" style="left: 40%;">
    <img class="fish" src="fish.png" alt="fish3" style="left: 60%;">
</body>
</html>
